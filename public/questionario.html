      class StandaloneDB {
        constructor() {
          this.dbPromise = null;
        }

        openDB() {
          if (this.dbPromise) return this.dbPromise;

          if (typeof window === 'undefined' || !window.indexedDB) {
            return Promise.reject(new Error('IndexedDB indisponível'));
          }

          this.dbPromise = new Promise((resolve, reject) => {
            const request = window.indexedDB.open(DB_NAME, DB_VERSION);

            request.onupgradeneeded = (event) => {
              const db = event.target.result;
              if (!db.objectStoreNames.contains('perguntas')) {
                const store = db.createObjectStore('perguntas', { keyPath: 'id' });
                store.createIndex('categoria', 'categoria', { unique: false });
                store.createIndex('ordem', 'ordem', { unique: false });
              }
              if (!db.objectStoreNames.contains('respostas')) {
                const store = db.createObjectStore('respostas', { keyPath: 'id' });
                store.createIndex('salaId', 'salaId', { unique: false });
                store.createIndex('turmaId', 'turmaId', { unique: false });
                store.createIndex('timestamp', 'timestamp', { unique: false });
                store.createIndex('professorNome', 'professorNome', { unique: false });
              }
              if (!db.objectStoreNames.contains('salas')) {
                db.createObjectStore('salas', { keyPath: 'id' });
              }
              if (!db.objectStoreNames.contains('turmas')) {
                db.createObjectStore('turmas', { keyPath: 'id' });
              }
            };

            request.onsuccess = async () => {
              const db = request.result;
              try {
                await this.seedDefaultsIfEmpty(db);
              } catch (e) {
                console.warn('Seed error:', e);
              }
              resolve(db);
            };

            request.onerror = () => {
              reject(request.error);
            };
          });

          return this.dbPromise;
        }

        async seedDefaultsIfEmpty(db) {
          const checkEmpty = (storeName) => {
            return new Promise((res) => {
              const tx = db.transaction(storeName, 'readonly');
              const store = tx.objectStore(storeName);
              const req = store.count();
              req.onsuccess = () => res(req.result === 0);
              req.onerror = () => res(false);
            });
          };

          const salasEmpty = await checkEmpty('salas');
          if (salasEmpty) {
            const tx = db.transaction('salas', 'readwrite');
            const store = tx.objectStore('salas');
            INITIAL_SALAS.forEach((s) => store.put(s));
          }

          const turmasEmpty = await checkEmpty('turmas');
          if (turmasEmpty) {
            const tx = db.transaction('turmas', 'readwrite');
            const store = tx.objectStore('turmas');
            INITIAL_TURMAS.forEach((t) => store.put(t));
          }

          const perguntasEmpty = await checkEmpty('perguntas');
          if (perguntasEmpty) {
            const tx = db.transaction('perguntas', 'readwrite');
            const store = tx.objectStore('perguntas');
            INITIAL_PERGUNTAS.forEach((p) => store.put(p));
          }

          const respostasEmpty = await checkEmpty('respostas');
          if (respostasEmpty) {
            const tx = db.transaction('respostas', 'readwrite');
            const store = tx.objectStore('respostas');
            INITIAL_RESPOSTAS.forEach((r) => store.put(r));
          }
        }

        async getAll(storeName) {
          try {
            const db = await this.openDB();
            return new Promise((resolve, reject) => {
              const tx = db.transaction(storeName, 'readonly');
              const store = tx.objectStore(storeName);
              const req = store.getAll();
              req.onsuccess = () => resolve(req.result);
              req.onerror = () => reject(req.error);
            });
          } catch {
            const raw = localStorage.getItem(`fallback_${storeName}`);
            if (raw) return JSON.parse(raw);
            if (storeName === 'perguntas') return INITIAL_PERGUNTAS;
            if (storeName === 'salas') return INITIAL_SALAS;
            if (storeName === 'turmas') return INITIAL_TURMAS;
            if (storeName === 'respostas') return INITIAL_RESPOSTAS;
            return [];
          }
        }

        async putItem(storeName, item) {
          try {
            const db = await this.openDB();
            return new Promise((resolve, reject) => {
              const tx = db.transaction(storeName, 'readwrite');
              const store = tx.objectStore(storeName);
              const req = store.put(item);
              req.onsuccess = () => resolve();
              req.onerror = () => reject(req.error);
            });
          } catch {
            const list = await this.getAll(storeName);
            const idx = list.findIndex((i) => i.id === item.id);
            if (idx >= 0) list[idx] = item;
            else list.push(item);
            localStorage.setItem(`fallback_${storeName}`, JSON.stringify(list));
          }
        }

        async deleteItem(storeName, id) {
          try {
            const db = await this.openDB();
            return new Promise((resolve, reject) => {
              const tx = db.transaction(storeName, 'readwrite');
              const store = tx.objectStore(storeName);
              const req = store.delete(id);
              req.onsuccess = () => resolve();
              req.onerror = () => reject(req.error);
            });
          } catch {
            const list = await this.getAll(storeName);
            const filtered = list.filter((i) => i.id !== id);
            localStorage.setItem(`fallback_${storeName}`, JSON.stringify(filtered));
          }
        }

        async restaurarPadrao() {
          try {
            const db = await this.openDB();
            const stores = ['perguntas', 'salas', 'turmas', 'respostas'];
            for (const st of stores) {
              const tx = db.transaction(st, 'readwrite');
              tx.objectStore(st).clear();
            }
            await this.seedDefaultsIfEmpty(db);
          } catch {
            localStorage.removeItem('fallback_perguntas');
            localStorage.removeItem('fallback_salas');
            localStorage.removeItem('fallback_turmas');
            localStorage.removeItem('fallback_respostas');
          }
        }
      }

          <path strokeLinecap="round" strokeLinejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21" />
        </svg>
      );

      // Função utilitária para baixar este próprio arquivo HTML
      function baixarArquivoHtmlAtual() {
        const conteudo = "<!doctype html>\n" + document.documentElement.outerHTML;
        const blob = new Blob([conteudo], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'questionario-escolar-autonomo.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      // ==========================================
      // APLICAÇÃO PRINCIPAL REACT
      // ==========================================
      function App() {
        const [session, setSession] = useState(() => {
          try {
            const saved = localStorage.getItem('escola_user_session');
            return saved ? JSON.parse(saved) : null;
          } catch {
            return null;
          }
        });

        const [perguntas, setPerguntas] = useState([]);
        const [respostas, setRespostas] = useState([]);
        const [salas, setSalas] = useState([]);
        const [turmas, setTurmas] = useState([]);
        const [isLoading, setIsLoading] = useState(true);

        const carregarDados = async () => {
          try {
            const [pList, rList, sList, tList] = await Promise.all([
              db.getAll('perguntas'),
              db.getAll('respostas'),
              db.getAll('salas'),
              db.getAll('turmas'),
            ]);
            setPerguntas(pList.sort((a, b) => a.ordem - b.ordem));
            setRespostas(rList.sort((a, b) => b.timestamp - a.timestamp));
            setSalas(sList);
            setTurmas(tList);
          } catch (e) {
            console.error('Erro ao carregar dados:', e);
          } finally {
            setIsLoading(false);
          }
        };

        useEffect(() => {
          carregarDados();
        }, []);

        const handleLogin = (userSession) => {
          setSession(userSession);
          try {
            localStorage.setItem('escola_user_session', JSON.stringify(userSession));
          } catch {}
        };

        const handleLogout = () => {
          setSession(null);
          try {
            localStorage.removeItem('escola_user_session');
          } catch {}
        };

        // Respostas
        const handleSalvarResposta = async (respostaData) => {
          const now = Date.now();
          const nova = {
            ...respostaData,
            id: 'resp-' + now,
            criadaEm: new Date(now).toISOString(),
            timestamp: now,
          };
          await db.putItem('respostas', nova);
          const lista = await db.getAll('respostas');
          setRespostas(lista.sort((a, b) => b.timestamp - a.timestamp));
        };

        // Perguntas
        const handleAddPergunta = async (perguntaData) => {
          const nova = {
            ...perguntaData,
            id: 'p-' + Date.now(),
            ordem: perguntas.length + 1,
            criadaEm: new Date().toISOString(),
          };
          await db.putItem('perguntas', nova);
          const lista = await db.getAll('perguntas');
          setPerguntas(lista.sort((a, b) => a.ordem - b.ordem));
        };

        const handleDeletePergunta = async (id) => {
          await db.deleteItem('perguntas', id);
          const lista = await db.getAll('perguntas');
          setPerguntas(lista.sort((a, b) => a.ordem - b.ordem));
        };

        const handleTogglePerguntaAtiva = async (id, ativa) => {
          const p = perguntas.find((item) => item.id === id);
          if (!p) return;
          const atualizada = { ...p, ativa };
          await db.putItem('perguntas', atualizada);
          const lista = await db.getAll('perguntas');
          setPerguntas(lista.sort((a, b) => a.ordem - b.ordem));
        };

        // Salas
        const handleAddSala = async (nome, bloco) => {
          const nova = { id: 'sala-' + Date.now(), nome, bloco };
          await db.putItem('salas', nova);
          const lista = await db.getAll('salas');
          setSalas(lista);
        };

        const handleDeleteSala = async (id) => {
          await db.deleteItem('salas', id);
          const lista = await db.getAll('salas');
          setSalas(lista);
        };

        // Turmas
        const handleAddTurma = async (nome, turno) => {
          const nova = { id: 'turma-' + Date.now(), nome, turno };
          await db.putItem('turmas', nova);
          const lista = await db.getAll('turmas');
          setTurmas(lista);
        };

        const handleDeleteTurma = async (id) => {
          await db.deleteItem('turmas', id);
          const lista = await db.getAll('turmas');
          setTurmas(lista);
        };

        const handleDeleteResposta = async (id) => {
          await db.deleteItem('respostas', id);
          const lista = await db.getAll('respostas');
          setRespostas(lista.sort((a, b) => b.timestamp - a.timestamp));
        };

        const handleResetDefaults = async () => {
          if (confirm('Deseja restaurar as perguntas, salas, turmas e respostas de demonstração padrão?')) {
            setIsLoading(true);
            await db.restaurarPadrao();
            await carregarDados();
            setIsLoading(false);
          }
        };

        const handleExportCsv = () => {
          if (respostas.length === 0) {
            alert('Não há respostas salvas para exportar.');
            return;
          }
          let csv = '\uFEFF';
          csv += 'Data/Hora,Professor,Sala,Turma';
          perguntas.forEach((p) => {
            csv += `,"${p.enunciado.replace(/"/g, '""')}"`;
          });
          csv += '\n';

          respostas.forEach((r) => {
            const dataStr = new Date(r.timestamp).toLocaleString('pt-BR');
            let row = `"${dataStr}","${r.professorNome}","${r.salaNome}","${r.turmaNome}"`;
            perguntas.forEach((p) => {
              const val = r.respostas[p.id] !== undefined ? r.respostas[p.id] : '';
              row += `,"${String(val).replace(/"/g, '""')}"`;
            });
            csv += row + '\n';
          });

          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `relatorio_escolar_${Date.now()}.csv`;
          link.click();
          URL.revokeObjectURL(url);
        };

        const handleExportJson = () => {
          const backup = {
            sistema: 'EscolaQuestionarioDB',
            versao: 1,
            exportadoEm: new Date().toISOString(),
            dados: { perguntas, salas, turmas, respostas },
          };
          const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `backup_escolar_${Date.now()}.json`;
          link.click();
          URL.revokeObjectURL(url);
        };

        const handleImportJson = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (!parsed.dados) throw new Error('Formato inválido');
              const { perguntas: p, salas: s, turmas: t, respostas: r } = parsed.dados;
              if (Array.isArray(p)) for (const item of p) await db.putItem('perguntas', item);
              if (Array.isArray(s)) for (const item of s) await db.putItem('salas', item);
              if (Array.isArray(t)) for (const item of t) await db.putItem('turmas', item);
              if (Array.isArray(r)) for (const item of r) await db.putItem('respostas', item);
              await carregarDados();
              alert('Backup importado com sucesso!');
            } catch (err) {
              alert('Erro ao importar arquivo JSON: ' + err.message);
            }
          };
          reader.readAsText(file);
        };

        const handleChangeSalaTurma = (salaId, salaNome, turmaId, turmaNome) => {
          if (!session) return;
          const updated = { ...session, salaId, salaNome, turmaId, turmaNome };
          setSession(updated);
          try {
            localStorage.setItem('escola_user_session', JSON.stringify(updated));
          } catch {}
        };

        if (isLoading) {
          return (
            <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6 text-slate-700">
              <div className="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
              <p className="text-sm font-semibold text-slate-800">Conectando ao Banco de Dados IndexedDB...</p>
              <p className="text-xs text-slate-400 mt-1">Carregando salas, turmas e questionários</p>
            </div>
          );
        }

        return (
          <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
            {/* CABEÇALHO SUPERIOR */}
            <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-sm border-b border-slate-200 shadow-xs">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-sm">
                    <IconSchool className="w-5 h-5" />
                  </div>
                  <div>
                    <span className="text-lg font-bold tracking-tight text-slate-900 block leading-tight">
                      Colégio Saber Ativo
                    </span>
                    <span className="text-xs text-slate-500 font-medium hidden sm:block">
                      Sistema de Avaliação de Salas & Turmas (Autônomo)
                    </span>
                  </div>
                </div>

                <div className="flex items-center gap-2 sm:gap-3">
                  <button
                    onClick={baixarArquivoHtmlAtual}
                    title="Baixar este arquivo HTML único e autônomo para rodar localmente ou subir no GitHub"
                    className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200/80 rounded-lg transition-colors whitespace-nowrap cursor-pointer"
                  >
                    <IconDownload className="w-3.5 h-3.5" />
                    <span className="hidden sm:inline">Baixar Arquivo HTML Único</span>
                    <span className="sm:hidden">Baixar HTML</span>
                  </button>

                  {session ? (
                    <div className="flex items-center gap-2">
                      <div className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 rounded-lg border border-slate-200 text-xs text-slate-700">
                        {session.role === 'diretor' ? (
                          <>
                            <IconShield className="w-3.5 h-3.5 text-indigo-600" />
                            <span className="font-semibold text-indigo-900">Direção</span>
                          </>
                        ) : (
                          <>
                            <IconGraduation className="w-3.5 h-3.5 text-emerald-600" />
                            <span className="font-semibold text-emerald-900 truncate max-w-[120px]">{session.nome}</span>
                          </>
                        )}
                      </div>
                      <button
                        onClick={handleLogout}
                        className="inline-flex items-center gap-1 px-2.5 py-1.5 text-xs font-semibold text-slate-600 hover:text-red-700 hover:bg-red-50 border border-slate-200 rounded-lg transition-colors cursor-pointer"
                        title="Sair"
                      >
                        <IconLogout className="w-3.5 h-3.5" />
                        <span className="hidden sm:inline">Sair</span>
                      </button>
                    </div>
                  ) : (
                    <div className="hidden md:flex items-center gap-1.5 text-xs text-slate-500 font-medium">
                      <IconDatabase className="w-3.5 h-3.5 text-indigo-500" />
                      <span>IndexedDB Ativo</span>
                    </div>
                  )}
                </div>
              </div>
            </header>

            {/* CONTEÚDO PRINCIPAL */}
            <main className="flex-1">
              {!session ? (
                <ViewLogin
                  salas={salas}
                  turmas={turmas}
                  onLogin={handleLogin}
                  onDownloadHtml={baixarArquivoHtmlAtual}
                />
              ) : session.role === 'diretor' ? (
                <ViewDiretor
                  perguntas={perguntas}
                  respostas={respostas}
                  salas={salas}
                  turmas={turmas}
                  onAddPergunta={handleAddPergunta}
                  onDeletePergunta={handleDeletePergunta}
                  onTogglePerguntaAtiva={handleTogglePerguntaAtiva}
                  onAddSala={handleAddSala}
                  onDeleteSala={handleDeleteSala}
                  onAddTurma={handleAddTurma}
                  onDeleteTurma={handleDeleteTurma}
                  onDeleteResposta={handleDeleteResposta}
                  onResetDefaults={handleResetDefaults}
                  onExportCsv={handleExportCsv}
                  onExportJson={handleExportJson}
                  onImportJson={handleImportJson}
                  onDownloadHtml={baixarArquivoHtmlAtual}
                />
              ) : (
                <ViewProfessor
                  session={session}
                  perguntas={perguntas}
                  salas={salas}
                  turmas={turmas}
                  onSalvarResposta={handleSalvarResposta}
                  onChangeSalaTurma={handleChangeSalaTurma}
                />
              )}
            </main>

            {/* RODAPÉ */}
            <footer className="bg-white border-t border-slate-200 py-6 text-xs text-slate-500">
              <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
                <div>
                  Colégio Saber Ativo &bull; Arquivo HTML Único &bull; 100% Autônomo e sem tela branca
                </div>
                <div className="flex items-center gap-3">
                  <button
                    onClick={baixarArquivoHtmlAtual}
                    className="text-indigo-600 hover:text-indigo-800 font-semibold cursor-pointer"
                  >
                    Baixar Código (.html)
                  </button>
                  <span className="text-slate-300">|</span>
                  <span className="font-mono text-[11px] text-slate-400">IndexedDB Local v1.0</span>
                </div>
              </div>
            </footer>
          </div>
        );
      }

      // ==========================================
      // VIEW: PROFESSOR (QUESTIONÁRIO)
      // ==========================================
      function ViewProfessor({ session, perguntas, salas, turmas, onSalvarResposta, onChangeSalaTurma }) {
        const [respostasState, setRespostasState] = useState({});
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [showSuccessCard, setShowSuccessCard] = useState(false);
        const [showModalTroca, setShowModalTroca] = useState(false);

        const [tempSalaId, setTempSalaId] = useState(session.salaId || salas[0]?.id || '');
        const [tempTurmaId, setTempTurmaId] = useState(session.turmaId || turmas[0]?.id || '');

        const ativas = perguntas.filter((p) => p.ativa);
        const totalPerguntas = ativas.length;
        const respondidas = ativas.filter((p) => {
          const val = respostasState[p.id];
          return val !== undefined && val !== '';
        }).length;
        const percentual = totalPerguntas > 0 ? Math.round((respondidas / totalPerguntas) * 100) : 0;

        const handleSetValor = (pId, val) => {
          setRespostasState((prev) => ({ ...prev, [pId]: val }));
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          for (const p of ativas) {
            if (p.obrigatoria) {
              const val = respostasState[p.id];
              if (val === undefined || val === '') {
                alert(`Por favor, responda a pergunta obrigatória:\n"${p.enunciado}"`);
                return;
              }
            }
          }

          setIsSubmitting(true);
          try {
            await onSalvarResposta({
              professorNome: session.nome,
              salaId: session.salaId || 'sala-geral',
              salaNome: session.salaNome || 'Sala Principal',
              turmaId: session.turmaId || 'turma-geral',
              turmaNome: session.turmaNome || 'Turma Principal',
              respostas: respostasState,
            });
            setShowSuccessCard(true);
            setRespostasState({});
          } finally {
            setIsSubmitting(false);
          }
        };

        const handleConfirmarTroca = () => {
          const s = salas.find((i) => i.id === tempSalaId) || salas[0];
          const t = turmas.find((i) => i.id === tempTurmaId) || turmas[0];
          onChangeSalaTurma(s.id, s.nome, t.id, t.nome);
          setShowModalTroca(false);
        };

        if (showSuccessCard) {
          return (
            <div className="max-w-2xl mx-auto px-4 py-16 text-center">
              <div className="bg-white rounded-2xl p-8 border border-slate-200 shadow-sm">
                <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4">
                  <IconCheck className="w-8 h-8" />
                </div>
                <h2 className="text-2xl font-extrabold text-slate-900">Avaliação Salva com Sucesso!</h2>
                <p className="text-slate-600 text-sm mt-2 max-w-md mx-auto">
                  Suas respostas para a <strong>{session.salaNome}</strong> e turma <strong>{session.turmaNome}</strong> foram gravadas diretamente no banco de dados IndexedDB local.
                </p>

                <div className="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
                  <button
                    onClick={() => setShowSuccessCard(false)}
                    className="w-full sm:w-auto px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-lg transition-colors cursor-pointer"
                  >
                    Responder para outra Sala/Turma
                  </button>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div className="max-w-4xl mx-auto px-4 py-8">
            {/* Barra de identificação da aula */}
            <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div>
                <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider block">
                  Avaliação da Aula em Andamento
                </span>
                <div className="flex flex-wrap items-center gap-2 mt-1">
                  <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-indigo-50 border border-indigo-100 text-xs font-bold text-indigo-800">
                    <IconBuilding className="w-3.5 h-3.5 text-indigo-600" />
                    {session.salaNome || 'Sala Padrão'}
                  </span>
                  <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-emerald-50 border border-emerald-100 text-xs font-bold text-emerald-800">
                    <IconUsers className="w-3.5 h-3.5 text-emerald-600" />
                    {session.turmaNome || 'Turma Padrão'}
                  </span>
                </div>
              </div>

              <button
                type="button"
                onClick={() => setShowModalTroca(true)}
                className="px-3.5 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg border border-slate-300 transition-colors cursor-pointer"
              >
                Trocar Sala ou Turma
              </button>
            </div>

            {/* Barra de progresso */}
            <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-xs mb-6">
              <div className="flex items-center justify-between text-xs font-semibold text-slate-700 mb-2">
                <span>Progresso das Respostas: {respondidas} de {totalPerguntas} concluídas</span>
                <span className="text-indigo-600 font-bold">{percentual}%</span>
              </div>
              <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                <div
                  className="bg-indigo-600 h-2.5 rounded-full transition-all duration-300"
                  style={{ width: `${percentual}%` }}
                ></div>
              </div>
            </div>

            {/* Formulário com as perguntas */}
            <form onSubmit={handleSubmit} className="space-y-5">
              {ativas.map((p, idx) => {
                const valorAtual = respostasState[p.id];
                const preenchida = valorAtual !== undefined && valorAtual !== '';

                return (
                  <div
                    key={p.id}
                    className={`bg-white rounded-2xl p-5 sm:p-6 border transition-all ${
                      preenchida
                        ? 'border-indigo-200 shadow-xs ring-1 ring-indigo-50'
                        : 'border-slate-200 shadow-xs'
                    }`}
                  >
                    <div className="flex items-start justify-between gap-3 mb-3">
                      <div className="flex items-center gap-2">
                        <span className="w-6 h-6 rounded-full bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center shrink-0">
                          {idx + 1}
                        </span>
                        <span className={`text-[11px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wide ${
                          p.categoria === 'sala'
                            ? 'bg-blue-50 text-blue-700 border border-blue-200/60'
                            : p.categoria === 'turma'
                            ? 'bg-emerald-50 text-emerald-700 border border-emerald-200/60'
                            : 'bg-purple-50 text-purple-700 border border-purple-200/60'
                        }`}>
                          {p.categoria === 'sala' ? 'Condições da Sala' : p.categoria === 'turma' ? 'Comportamento da Turma' : 'Geral'}
                        </span>
                      </div>
                      {p.obrigatoria && (
                        <span className="text-[11px] font-semibold text-red-600 bg-red-50 px-2 py-0.5 rounded border border-red-100">
                          Obrigatória
                        </span>
                      )}
                    </div>

                    <h3 className="text-base font-semibold text-slate-900 leading-snug mb-4">
                      {p.enunciado}
                    </h3>

                    {/* RENDERIZADOR POR TIPO */}
                    {p.tipo === 'escala' && (
                      <div>
                        <div className="grid grid-cols-5 gap-2 sm:gap-3 max-w-md">
                          {[1, 2, 3, 4, 5].map((num) => {
                            const isSelected = valorAtual === num;
                            return (
                              <button
                                key={num}
                                type="button"
                                onClick={() => handleSetValor(p.id, num)}
                                className={`py-3 px-2 rounded-xl font-bold text-sm border flex flex-col items-center justify-center gap-1 transition-all cursor-pointer ${
                                  isSelected
                                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                                    : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'
                                }`}
                              >
                                <span className="text-lg">{num}</span>
                                <IconStar className="w-3.5 h-3.5" filled={isSelected} />
                              </button>
                            );
                          })}
                        </div>
                        <div className="flex justify-between max-w-md text-[11px] text-slate-400 font-medium mt-2 px-1">
                          <span>1 - Muito Ruim</span>
                          <span>3 - Regular</span>
                          <span>5 - Excelente</span>
                        </div>
                      </div>
                    )}

                    {p.tipo === 'sim_nao' && (
                      <div className="flex gap-3 max-w-xs">
                        {['Sim', 'Não'].map((opt) => {
                          const isSelected = valorAtual === opt;
                          return (
                            <button
                              key={opt}
                              type="button"
                              onClick={() => handleSetValor(p.id, opt)}
                              className={`flex-1 py-2.5 px-4 rounded-xl font-bold text-sm border flex items-center justify-center gap-2 transition-all cursor-pointer ${
                                isSelected
                                  ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                                  : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'
                              }`}
                            >
                              <span className={`w-3.5 h-3.5 rounded-full border flex items-center justify-center ${
                                isSelected ? 'border-white bg-white' : 'border-slate-400'
                              }`}>
                                {isSelected && <span className="w-2 h-2 rounded-full bg-indigo-600"></span>}
                              </span>
                              {opt}
                            </button>
                          );
                        })}
                      </div>
                    )}

                    {p.tipo === 'multipla_escolha' && (
                      <div className="space-y-2">
                        {(p.opcoes || []).map((opt) => {
                          const isSelected = valorAtual === opt;
                          return (
                            <label
                              key={opt}
                              onClick={() => handleSetValor(p.id, opt)}
                              className={`flex items-center gap-3 p-3 rounded-xl border text-sm font-medium transition-all cursor-pointer ${
                                isSelected
                                  ? 'bg-indigo-50/70 border-indigo-400 text-indigo-950 font-semibold'
                                  : 'bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-700'
                              }`}
                            >
                              <input
                                type="radio"
                                name={`p_${p.id}`}
                                checked={isSelected}
                                onChange={() => handleSetValor(p.id, opt)}
                                className="w-4 h-4 text-indigo-600 focus:ring-indigo-500"
                              />
                              <span>{opt}</span>
                            </label>
                          );
                        })}
                      </div>
                    )}

                    {p.tipo === 'texto' && (
                      <textarea
                        rows="3"
                        value={valorAtual || ''}
                        onChange={(e) => handleSetValor(p.id, e.target.value)}
                        placeholder="Digite aqui suas observações sobre a sala ou a turma..."
                        className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-600 bg-slate-50"
                      ></textarea>
                    )}
                  </div>
                );
              })}

              <div className="pt-4 pb-12">
                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white font-bold text-base rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer"
                >
                  {isSubmitting ? (
                    <span>Gravando no Banco IndexedDB...</span>
                  ) : (
                    <>
                      <span>Concluir e Enviar Avaliação</span>
                      <IconCheck className="w-5 h-5" />
                    </>
                  )}
                </button>
              </div>
            </form>

            {/* Modal de Troca de Sala / Turma */}
            {showModalTroca && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-200">
                  <h3 className="text-lg font-bold text-slate-900 mb-1">Trocar Sala ou Turma</h3>
                  <p className="text-xs text-slate-500 mb-4">
                    Atualize o local ou a turma sem precisar reiniciar sua sessão.
                  </p>
                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Sala:</label>
                      <select
                        value={tempSalaId}
                        onChange={(e) => setTempSalaId(e.target.value)}
                        className="w-full p-2.5 text-sm border border-slate-300 rounded-lg bg-slate-50"
                      >
                        {salas.map((s) => (
                          <option key={s.id} value={s.id}>{s.nome}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Turma:</label>
                      <select
                        value={tempTurmaId}
                        onChange={(e) => setTempTurmaId(e.target.value)}
                        className="w-full p-2.5 text-sm border border-slate-300 rounded-lg bg-slate-50"
                      >
                        {turmas.map((t) => (
                          <option key={t.id} value={t.id}>{t.nome} ({t.turno})</option>
                        ))}
                      </select>
                    </div>
                  </div>
                  <div className="flex gap-2 justify-end mt-6">
                    <button
                      type="button"
                      onClick={() => setShowModalTroca(false)}
                      className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg cursor-pointer"
                    >
                      Cancelar
                    </button>
                    <button
                      type="button"
                      onClick={handleConfirmarTroca}
                      className="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg cursor-pointer"
                    >
                      Confirmar Troca
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // ==========================================
      // VIEW: DIRETOR (PAINEL ADMINISTRATIVO COMPLETO)
      // ==========================================
      function ViewDiretor({
        perguntas,
        respostas,
        salas,
        turmas,
        onAddPergunta,
        onDeletePergunta,
        onTogglePerguntaAtiva,
        onAddSala,
        onDeleteSala,
        onAddTurma,
        onDeleteTurma,
        onDeleteResposta,
        onResetDefaults,
        onExportCsv,
        onExportJson,
        onImportJson,
        onDownloadHtml,
      }) {
        const [abaAtiva, setAbaAtiva] = useState('perguntas');

        // Form nova pergunta
        const [showModalNovaPergunta, setShowModalNovaPergunta] = useState(false);
        const [enunciado, setEnunciado] = useState('');
        const [categoria, setCategoria] = useState('sala');
        const [tipo, setTipo] = useState('escala');
        const [opcoesTexto, setOpcoesTexto] = useState('Excelente\nBom\nRegular\nRuim');
        const [obrigatoria, setObrigatoria] = useState(true);

        // Filtros respostas
        const [filtroSala, setFiltroSala] = useState('todos');
        const [filtroTurma, setFiltroTurma] = useState('todos');
        const [filtroBusca, setFiltroBusca] = useState('');
        const [detalheResposta, setDetalheResposta] = useState(null);

        // Nova Sala / Turma
        const [novaSalaNome, setNovaSalaNome] = useState('');
        const [novaSalaBloco, setNovaSalaBloco] = useState('Bloco Principal');
        const [novaTurmaNome, setNovaTurmaNome] = useState('');
        const [novaTurmaTurno, setNovaTurmaTurno] = useState('Manhã');

        const handleSubmitNovaPergunta = async (e) => {
          e.preventDefault();
          if (!enunciado.trim()) return;
          let opcoes = undefined;
          if (tipo === 'multipla_escolha') {
            opcoes = opcoesTexto.split('\n').map((s) => s.trim()).filter(Boolean);
            if (opcoes.length < 2) {
              alert('Informe pelo menos 2 opções para a múltipla escolha.');
              return;
            }
          }
          await onAddPergunta({
            enunciado: enunciado.trim(),
            categoria,
            tipo,
            opcoes,
            obrigatoria,
            ativa: true,
          });
          setEnunciado('');
          setShowModalNovaPergunta(false);
        };

        const handleCriarSala = async (e) => {
          e.preventDefault();
          if (!novaSalaNome.trim()) return;
          await onAddSala(novaSalaNome.trim(), novaSalaBloco.trim());
          setNovaSalaNome('');
        };

        const handleCriarTurma = async (e) => {
          e.preventDefault();
          if (!novaTurmaNome.trim()) return;
          await onAddTurma(novaTurmaNome.trim(), novaTurmaTurno);
          setNovaTurmaNome('');
        };

        // Filtro de respostas
        const respostasFiltradas = useMemo(() => {
          return respostas.filter((r) => {
            if (filtroSala !== 'todos' && r.salaId !== filtroSala) return false;
            if (filtroTurma !== 'todos' && r.turmaId !== filtroTurma) return false;
            if (filtroBusca.trim()) {
              const b = filtroBusca.toLowerCase();
              const nome = (r.professorNome || '').toLowerCase();
              const obs = (r.respostas['p-7'] || '').toLowerCase();
              if (!nome.includes(b) && !obs.includes(b)) return false;
            }
            return true;
          });
        }, [respostas, filtroSala, filtroTurma, filtroBusca]);

        // Estatísticas
        const mediaEscala = useMemo(() => {
          let soma = 0;
          let count = 0;
          respostas.forEach((r) => {
            Object.entries(r.respostas).forEach(([key, val]) => {
              const p = perguntas.find((item) => item.id === key);
              if (p && p.tipo === 'escala' && typeof val === 'number') {
                soma += val;
                count++;
              }
            });
          });
          return count > 0 ? (soma / count).toFixed(1) : '5.0';
        }, [respostas, perguntas]);

        return (
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {/* KPI Cards */}
            <div className="grid grid-cols-2 lg:grid-cols-5 gap-3 sm:gap-4 mb-8">
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Avaliações</span>
                <span className="text-2xl font-black text-indigo-600 mt-1 block">{respostas.length}</span>
                <span className="text-[11px] text-slate-500">Registradas no IndexedDB</span>
              </div>
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Média Geral</span>
                <span className="text-2xl font-black text-amber-500 mt-1 block flex items-center gap-1">
                  {mediaEscala} <IconStar className="w-5 h-5 inline text-amber-400" filled />
                </span>
                <span className="text-[11px] text-slate-500">Escala de 1 a 5</span>
              </div>
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Perguntas Ativas</span>
                <span className="text-2xl font-black text-slate-900 mt-1 block">
                  {perguntas.filter((p) => p.ativa).length} <span className="text-sm font-normal text-slate-400">/ {perguntas.length}</span>
                </span>
                <span className="text-[11px] text-slate-500">Configuradas</span>
              </div>
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Salas</span>
                <span className="text-2xl font-black text-slate-900 mt-1 block">{salas.length}</span>
                <span className="text-[11px] text-slate-500">Monitoradas</span>
              </div>
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs col-span-2 lg:col-span-1">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Turmas</span>
                <span className="text-2xl font-black text-slate-900 mt-1 block">{turmas.length}</span>
                <span className="text-[11px] text-slate-500">Cadastradas</span>
              </div>
            </div>

            {/* Abas do Painel */}
            <div className="flex border-b border-slate-200 mb-6 overflow-x-auto gap-2">
              <button
                onClick={() => setAbaAtiva('perguntas')}
                className={`pb-3 px-4 text-sm font-bold border-b-2 transition-colors cursor-pointer whitespace-nowrap ${
                  abaAtiva === 'perguntas'
                    ? 'border-indigo-600 text-indigo-600'
                    : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                1. Perguntas Cadastradas ({perguntas.length})
              </button>
              <button
                onClick={() => setAbaAtiva('respostas')}
                className={`pb-3 px-4 text-sm font-bold border-b-2 transition-colors cursor-pointer whitespace-nowrap ${
                  abaAtiva === 'respostas'
                    ? 'border-indigo-600 text-indigo-600'
                    : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                2. Respostas & Histórico ({respostas.length})
              </button>
              <button
                onClick={() => setAbaAtiva('salas_turmas')}
                className={`pb-3 px-4 text-sm font-bold border-b-2 transition-colors cursor-pointer whitespace-nowrap ${
                  abaAtiva === 'salas_turmas'
                    ? 'border-indigo-600 text-indigo-600'
                    : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                3. Salas & Turmas
              </button>
              <button
                onClick={() => setAbaAtiva('backup')}
                className={`pb-3 px-4 text-sm font-bold border-b-2 transition-colors cursor-pointer whitespace-nowrap ${
                  abaAtiva === 'backup'
                    ? 'border-indigo-600 text-indigo-600'
                    : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                4. Exportações & Banco Local
              </button>
            </div>

            {/* ABA 1: PERGUNTAS */}
            {abaAtiva === 'perguntas' && (
              <div>
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-5">
                  <div>
                    <h2 className="text-lg font-bold text-slate-900">Gerenciador de Perguntas do Questionário</h2>
                    <p className="text-xs text-slate-500">
                      Cadastre, ative/desative ou exclua perguntas. Elas aparecem imediatamente no formulário dos professores.
                    </p>
                  </div>
                  <button
                    onClick={() => setShowModalNovaPergunta(true)}
                    className="inline-flex items-center gap-1.5 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-xl shadow-xs transition-colors cursor-pointer"
                  >
                    <IconPlus className="w-4 h-4" />
                    <span>Cadastrar Nova Pergunta</span>
                  </button>
                </div>

                <div className="space-y-3">
                  {perguntas.map((p, idx) => (
                    <div
                      key={p.id}
                      className={`bg-white rounded-xl p-4 sm:p-5 border transition-all flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 ${
                        p.ativa ? 'border-slate-200 shadow-xs' : 'border-slate-200 bg-slate-50/60 opacity-60'
                      }`}
                    >
                      <div className="space-y-1.5 flex-1">
                        <div className="flex flex-wrap items-center gap-2">
                          <span className="font-mono text-xs font-bold text-slate-400">#{idx + 1}</span>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider ${
                            p.categoria === 'sala' ? 'bg-blue-100 text-blue-800' : p.categoria === 'turma' ? 'bg-emerald-100 text-emerald-800' : 'bg-purple-100 text-purple-800'
                          }`}>
                            {p.categoria === 'sala' ? 'Sala' : p.categoria === 'turma' ? 'Turma' : 'Geral'}
                          </span>
                          <span className="text-[10px] font-semibold bg-slate-100 text-slate-700 px-2 py-0.5 rounded">
                            Tipo: {p.tipo === 'escala' ? 'Escala 1 a 5' : p.tipo === 'sim_nao' ? 'Sim / Não' : p.tipo === 'multipla_escolha' ? 'Múltipla Escolha' : 'Texto Livre'}
                          </span>
                          {p.obrigatoria && (
                            <span className="text-[10px] font-semibold text-red-600 bg-red-50 px-1.5 py-0.5 rounded">
                              Obrigatória
                            </span>
                          )}
                        </div>
                        <p className="text-sm font-semibold text-slate-900">{p.enunciado}</p>
                        {p.tipo === 'multipla_escolha' && p.opcoes && (
                          <p className="text-xs text-slate-500">
                            Opções: {p.opcoes.join(' | ')}
                          </p>
                        )}
                      </div>

                      <div className="flex items-center gap-3 shrink-0 self-end sm:self-center">
                        <label className="flex items-center gap-2 text-xs font-semibold text-slate-600 cursor-pointer">
                          <input
                            type="checkbox"
                            checked={p.ativa}
                            onChange={(e) => onTogglePerguntaAtiva(p.id, e.target.checked)}
                            className="w-4 h-4 text-indigo-600 rounded"
                          />
                          <span>{p.ativa ? 'Ativa' : 'Inativa'}</span>
                        </label>
                        <button
                          onClick={() => {
                            if (confirm(`Excluir a pergunta: "${p.enunciado}"?`)) {
                              onDeletePergunta(p.id);
                            }
                          }}
                          className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors cursor-pointer"
                          title="Excluir pergunta"
                        >
                          <IconTrash className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ABA 2: RESPOSTAS */}
            {abaAtiva === 'respostas' && (
              <div>
                {/* Filtros */}
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs mb-6 grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Filtrar por Sala:</label>
                    <select
                      value={filtroSala}
                      onChange={(e) => setFiltroSala(e.target.value)}
                      className="w-full p-2 text-xs border border-slate-300 rounded-lg bg-slate-50"
                    >
                      <option value="todos">Todas as salas ({salas.length})</option>
                      {salas.map((s) => (
                        <option key={s.id} value={s.id}>{s.nome}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Filtrar por Turma:</label>
                    <select
                      value={filtroTurma}
                      onChange={(e) => setFiltroTurma(e.target.value)}
                      className="w-full p-2 text-xs border border-slate-300 rounded-lg bg-slate-50"
                    >
                      <option value="todos">Todas as turmas ({turmas.length})</option>
                      {turmas.map((t) => (
                        <option key={t.id} value={t.id}>{t.nome}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Buscar por Professor / Palavra:</label>
                    <input
                      type="text"
                      value={filtroBusca}
                      onChange={(e) => setFiltroBusca(e.target.value)}
                      placeholder="Ex: Carlos, projetor..."
                      className="w-full p-2 text-xs border border-slate-300 rounded-lg bg-slate-50"
                    />
                  </div>
                </div>

                <div className="flex items-center justify-between mb-4">
                  <span className="text-xs font-semibold text-slate-500">
                    Mostrando {respostasFiltradas.length} de {respostas.length} avaliações
                  </span>
                  <button
                    onClick={onExportCsv}
                    className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-emerald-800 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-lg transition-colors cursor-pointer"
                  >
                    <IconDownload className="w-3.5 h-3.5" />
                    <span>Exportar Relatório CSV</span>
                  </button>
                </div>

                {respostasFiltradas.length === 0 ? (
                  <div className="bg-white rounded-2xl p-8 text-center border border-slate-200 text-slate-400 text-sm">
                    Nenhuma resposta encontrada para os filtros selecionados.
                  </div>
                ) : (
                  <div className="space-y-3">
                    {respostasFiltradas.map((r) => {
                      const dataFormatada = new Date(r.timestamp).toLocaleString('pt-BR');
                      return (
                        <div
                          key={r.id}
                          className="bg-white rounded-xl p-4 sm:p-5 border border-slate-200 shadow-xs hover:border-indigo-200 transition-all"
                        >
                          <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 mb-2 pb-2 border-b border-slate-100">
                            <div className="flex items-center gap-2">
                              <span className="font-bold text-slate-900 text-sm">{r.professorNome}</span>
                              <span className="text-xs text-slate-400">&bull;</span>
                              <span className="text-xs text-slate-500 font-mono">{dataFormatada}</span>
                            </div>
                            <div className="flex items-center gap-2">
                              <span className="px-2 py-0.5 rounded text-[11px] font-semibold bg-indigo-50 text-indigo-700 border border-indigo-100">
                                {r.salaNome}
                              </span>
                              <span className="px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-100">
                                {r.turmaNome}
                              </span>
                              <button
                                onClick={() => {
                                  if (confirm('Deseja excluir este registro de avaliação?')) {
                                    onDeleteResposta(r.id);
                                  }
                                }}
                                className="p-1 text-slate-400 hover:text-red-600 rounded transition-colors ml-2"
                                title="Excluir resposta"
                              >
                                <IconTrash className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </div>

                          <div className="text-xs text-slate-600 space-y-1 mb-3">
                            {r.respostas['p-1'] && (
                              <p>Condições físicas: <strong>Nota {r.respostas['p-1']} / 5</strong></p>
                            )}
                            {r.respostas['p-4'] && (
                              <p>Engajamento da turma: <strong>Nota {r.respostas['p-4']} / 5</strong></p>
                            )}
                            {r.respostas['p-7'] && (
                              <p className="italic text-slate-500 mt-1 line-clamp-2">
                                &ldquo;{r.respostas['p-7']}&rdquo;
                              </p>
                            )}
                          </div>

                          <button
                            onClick={() => setDetalheResposta(r)}
                            className="text-xs font-semibold text-indigo-600 hover:text-indigo-800 cursor-pointer"
                          >
                            Ver Respostas Completas &rarr;
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* ABA 3: SALAS & TURMAS */}
            {abaAtiva === 'salas_turmas' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {/* Gestão de Salas */}
                <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
                  <h3 className="text-base font-bold text-slate-900 mb-1">Salas & Laboratórios</h3>
                  <p className="text-xs text-slate-500 mb-4">Adicione ou remova ambientes escolares monitorados.</p>

                  <form onSubmit={handleCriarSala} className="flex gap-2 mb-4">
                    <input
                      type="text"
                      value={novaSalaNome}
                      onChange={(e) => setNovaSalaNome(e.target.value)}
                      placeholder="Nome da sala (ex: Sala 103)"
                      className="flex-1 px-3 py-1.5 text-xs border border-slate-300 rounded-lg bg-slate-50"
                    />
                    <button
                      type="submit"
                      className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-lg transition-colors cursor-pointer"
                    >
                      + Adicionar
                    </button>
                  </form>

                  <div className="space-y-2">
                    {salas.map((s) => (
                      <div key={s.id} className="flex items-center justify-between p-2.5 rounded-lg bg-slate-50 border border-slate-200 text-xs">
                        <span className="font-semibold text-slate-800">{s.nome}</span>
                        <button
                          onClick={() => {
                            if (confirm(`Remover a sala: "${s.nome}"?`)) onDeleteSala(s.id);
                          }}
                          className="text-slate-400 hover:text-red-600 p-1"
                        >
                          <IconTrash className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Gestão de Turmas */}
                <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
                  <h3 className="text-base font-bold text-slate-900 mb-1">Turmas & Séries</h3>
                  <p className="text-xs text-slate-500 mb-4">Adicione turmas e seus respectivos turnos escolares.</p>

                  <form onSubmit={handleCriarTurma} className="flex gap-2 mb-4">
                    <input
                      type="text"
                      value={novaTurmaNome}
                      onChange={(e) => setNovaTurmaNome(e.target.value)}
                      placeholder="Nome da turma (ex: 2º Ano B)"
                      className="flex-1 px-3 py-1.5 text-xs border border-slate-300 rounded-lg bg-slate-50"
                    />
                    <select
                      value={novaTurmaTurno}
                      onChange={(e) => setNovaTurmaTurno(e.target.value)}
                      className="px-2 py-1.5 text-xs border border-slate-300 rounded-lg bg-slate-50"
                    >
                      <option value="Manhã">Manhã</option>
                      <option value="Tarde">Tarde</option>
                      <option value="Noite">Noite</option>
                      <option value="Integral">Integral</option>
                    </select>
                    <button
                      type="submit"
                      className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-lg transition-colors cursor-pointer"
                    >
                      + Adicionar
                    </button>
                  </form>

                  <div className="space-y-2">
                    {turmas.map((t) => (
                      <div key={t.id} className="flex items-center justify-between p-2.5 rounded-lg bg-slate-50 border border-slate-200 text-xs">
                        <div>
                          <span className="font-semibold text-slate-800">{t.nome}</span>
                          <span className="text-slate-400 ml-1.5 font-normal">({t.turno})</span>
                        </div>
                        <button
                          onClick={() => {
                            if (confirm(`Remover a turma: "${t.nome}"?`)) onDeleteTurma(t.id);
                          }}
                          className="text-slate-400 hover:text-red-600 p-1"
                        >
                          <IconTrash className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ABA 4: BACKUP & EXPORTAÇÕES */}
            {abaAtiva === 'backup' && (
              <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs max-w-2xl">
                <h3 className="text-base font-bold text-slate-900 mb-1">Ferramentas de Banco de Dados & Arquivo Único</h3>
                <p className="text-xs text-slate-500 mb-6">
                  Como este aplicativo é 100% autônomo, seus dados residem no banco de dados IndexedDB do seu navegador. Você pode exportar backups, planilhas CSV e baixar o código fonte HTML único.
                </p>

                <div className="space-y-4">
                  <div className="p-4 rounded-xl border border-slate-200 bg-slate-50 flex items-center justify-between gap-4">
                    <div>
                      <h4 className="text-sm font-bold text-slate-800">Exportar Relatório CSV (Excel)</h4>
                      <p className="text-xs text-slate-500">Gera arquivo .csv com cabeçalho UTF-8 compatível com Excel e Google Planilhas.</p>
                    </div>
                    <button
                      onClick={onExportCsv}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg shrink-0 cursor-pointer"
                    >
                      Baixar .CSV
                    </button>
                  </div>

                  <div className="p-4 rounded-xl border border-slate-200 bg-slate-50 flex items-center justify-between gap-4">
                    <div>
                      <h4 className="text-sm font-bold text-slate-800">Backup Completo do Banco (JSON)</h4>
                      <p className="text-xs text-slate-500">Salva todas as perguntas, salas, turmas e respostas em arquivo JSON.</p>
                    </div>
                    <button
                      onClick={onExportJson}
                      className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shrink-0 cursor-pointer"
                    >
                      Exportar .JSON
                    </button>
                  </div>

                  <div className="p-4 rounded-xl border border-slate-200 bg-slate-50 flex items-center justify-between gap-4">
                    <div>
                      <h4 className="text-sm font-bold text-slate-800">Restaurar Backup (JSON)</h4>
                      <p className="text-xs text-slate-500">Importa dados previamente salvos para o banco IndexedDB.</p>
                    </div>
                    <label className="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-lg shrink-0 cursor-pointer">
                      Importar .JSON
                      <input type="file" accept=".json" onChange={onImportJson} className="hidden" />
                    </label>
                  </div>

                  <div className="p-4 rounded-xl border border-indigo-200 bg-indigo-50/50 flex items-center justify-between gap-4">
                    <div>
                      <h4 className="text-sm font-bold text-indigo-900">Baixar Este Arquivo HTML Único</h4>
                      <p className="text-xs text-indigo-700">Gera o arquivo autônomo com Tailwind e React para salvar no seu PC ou subir no GitHub.</p>
                    </div>
                    <button
                      onClick={onDownloadHtml}
                      className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shrink-0 cursor-pointer"
                    >
                      Baixar .HTML
                    </button>
                  </div>

                  <div className="p-4 rounded-xl border border-red-200 bg-red-50/50 flex items-center justify-between gap-4">
                    <div>
                      <h4 className="text-sm font-bold text-red-900">Restaurar Dados Padrão de Demonstração</h4>
                      <p className="text-xs text-red-700">Recarrega as 7 perguntas oficiais, 6 salas, 6 turmas e 3 respostas de teste.</p>
                    </div>
                    <button
                      onClick={onResetDefaults}
                      className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-lg shrink-0 cursor-pointer"
                    >
                      Restaurar Padrões
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL: NOVA PERGUNTA */}
            {showModalNovaPergunta && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl border border-slate-200 max-h-[90vh] overflow-y-auto">
                  <h3 className="text-lg font-bold text-slate-900 mb-1">Cadastrar Nova Pergunta</h3>
                  <p className="text-xs text-slate-500 mb-4">Adicione uma nova pergunta que ficará disponível no questionário dos professores.</p>

                  <form onSubmit={handleSubmitNovaPergunta} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Enunciado da Pergunta: *</label>
                      <textarea
                        rows="2"
                        required
                        value={enunciado}
                        onChange={(e) => setEnunciado(e.target.value)}
                        placeholder="Ex: Como você avalia a limpeza da sala de aula?"
                        className="w-full p-2.5 text-xs border border-slate-300 rounded-lg bg-slate-50"
                      ></textarea>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Categoria:</label>
                        <select
                          value={categoria}
                          onChange={(e) => setCategoria(e.target.value)}
                          className="w-full p-2 text-xs border border-slate-300 rounded-lg bg-slate-50"
                        >
                          <option value="sala">Condições da Sala</option>
                          <option value="turma">Comportamento da Turma</option>
                          <option value="geral">Geral / Observações</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Tipo de Resposta:</label>
                        <select
                          value={tipo}
                          onChange={(e) => setTipo(e.target.value)}
                          className="w-full p-2 text-xs border border-slate-300 rounded-lg bg-slate-50"
                        >
                          <option value="escala">Escala de 1 a 5</option>
                          <option value="sim_nao">Sim ou Não</option>
                          <option value="multipla_escolha">Múltipla Escolha</option>
                          <option value="texto">Texto Livre</option>
                        </select>
                      </div>
                    </div>

                    {tipo === 'multipla_escolha' && (
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">
                          Opções de Escolha (uma por linha):
                        </label>
                        <textarea
                          rows="4"
                          value={opcoesTexto}
                          onChange={(e) => setOpcoesTexto(e.target.value)}
                          className="w-full p-2.5 text-xs border border-slate-300 rounded-lg bg-slate-50 font-mono"
                        ></textarea>
                      </div>
                    )}

                    <div>
                      <label className="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={obrigatoria}
                          onChange={(e) => setObrigatoria(e.target.checked)}
                          className="w-4 h-4 text-indigo-600 rounded"
                        />
                        <span>Resposta Obrigatória para os professores</span>
                      </label>
                    </div>

                    <div className="flex gap-2 justify-end pt-3 border-t border-slate-100">
                      <button
                        type="button"
                        onClick={() => setShowModalNovaPergunta(false)}
                        className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg cursor-pointer"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg cursor-pointer"
                      >
                        Salvar Pergunta
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL: DETALHE COMPLETO DA RESPOSTA */}
            {detalheResposta && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl p-6 max-w-xl w-full shadow-2xl border border-slate-200 max-h-[90vh] overflow-y-auto">
                  <div className="flex items-start justify-between gap-3 mb-4 pb-3 border-b border-slate-100">
                    <div>
                      <h3 className="text-lg font-bold text-slate-900">{detalheResposta.professorNome}</h3>
                      <p className="text-xs text-slate-500">
                        {detalheResposta.salaNome} &bull; {detalheResposta.turmaNome} &bull; {new Date(detalheResposta.timestamp).toLocaleString('pt-BR')}
                      </p>
                    </div>
                    <button
                      onClick={() => setDetalheResposta(null)}
                      className="text-slate-400 hover:text-slate-700 p-1"
                    >
                      &times;
                    </button>
                  </div>

                  <div className="space-y-4">
                    {perguntas.map((p, idx) => {
                      const resposta = detalheResposta.respostas[p.id];
                      return (
                        <div key={p.id} className="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs">
                          <p className="font-semibold text-slate-800 mb-1">
                            {idx + 1}. {p.enunciado}
                          </p>
                          <div className="text-indigo-900 font-bold bg-white p-2 rounded border border-slate-200">
                            {resposta !== undefined && resposta !== '' ? String(resposta) : <span className="text-slate-400 italic">Não respondida</span>}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="mt-6 flex justify-end">
                    <button
                      type="button"
                      onClick={() => setDetalheResposta(null)}
                      className="px-4 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg cursor-pointer"
                    >
                      Fechar
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // Renderização na div#root
      const rootElement = document.getElementById('root');
      if (rootElement) {
        ReactDOM.createRoot(rootElement).render(<App />);
      }
    </script>
  </body>
</html>
