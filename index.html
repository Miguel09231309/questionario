    // ==============================================================
    // NATIVE SVG RADAR & BAR CHART (100% AUTÔNOMO SEM DEPENDÊNCIAS)
    // ==============================================================
    const CategoryCharts = ({ dadosCategorias, tipoGrafico, setTipoGrafico }) => {
      const [hoveredIndex, setHoveredIndex] = useState(null);

      // Radar Calculations (Center: 150, 150, Radius: 105)
      const cx = 160;
      const cy = 150;
      const r = 95;
      const count = dadosCategorias.length;

      const getCoordinates = (value, index) => {
        const angle = (Math.PI * 2 / count) * index - Math.PI / 2;
        const normalized = Math.max(0, Math.min(5, value)) / 5;
        const currentR = r * normalized;
        return {
          x: cx + currentR * Math.cos(angle),
          y: cy + currentR * Math.sin(angle),
        };
      };

      // Radar points for the polygon
      const pointsString = dadosCategorias
        .map((d, i) => {
          const { x, y } = getCoordinates(d.media, i);
          return `${x},${y}`;
        })
        .join(' ');

      return (
        <div className="w-full flex flex-col items-center">
          {tipoGrafico === 'radar' ? (
            <div className="relative w-full max-w-sm flex items-center justify-center py-2">
              <svg viewBox="0 0 320 300" className="w-full h-72 overflow-visible">
                {/* Background Concentric Polygons */}
                {[1, 2, 3, 4, 5].map((level) => {
                  const levelPoints = dadosCategorias
                    .map((_, i) => {
                      const { x, y } = getCoordinates(level, i);
                      return `${x},${y}`;
                    })
                    .join(' ');

                  return (
                    <polygon
                      key={level}
                      points={levelPoints}
                      fill="none"
                      stroke="#e2e8f0"
                      strokeWidth="1.2"
                      strokeDasharray={level < 5 ? "3 3" : undefined}
                    />
                  );
                })}

                {/* Axes radiating from center */}
                {dadosCategorias.map((d, i) => {
                  const end = getCoordinates(5, i);
                  return (
                    <line
                      key={i}
                      x1={cx}
                      y1={cy}
                      x2={end.x}
                      y2={end.y}
                      stroke="#cbd5e1"
                      strokeWidth="1"
                    />
                  );
                })}

                {/* Filled Radar Area */}
                <polygon
                  points={pointsString}
                  fill="#10b981"
                  fillOpacity="0.4"
                  stroke="#059669"
                  strokeWidth="2.5"
                  className="transition-all duration-300"
                />

                {/* Data Points */}
                {dadosCategorias.map((d, i) => {
                  const { x, y } = getCoordinates(d.media, i);
                  const isHovered = hoveredIndex === i;

                  return (
                    <g key={i} onMouseEnter={() => setHoveredIndex(i)} onMouseLeave={() => setHoveredIndex(null)}>
                      <circle
                        cx={x}
                        cy={y}
                        r={isHovered ? 7 : 4.5}
                        fill={d.cor}
                        stroke="#ffffff"
                        strokeWidth="2"
                        className="cursor-pointer transition-all"
                      />
                    </g>
                  );
                })}

                {/* Axis Labels */}
                {dadosCategorias.map((d, i) => {
                  const labelCoord = getCoordinates(5.9, i);
                  let textAnchor = "middle";
                  if (labelCoord.x > cx + 15) textAnchor = "start";
                  else if (labelCoord.x < cx - 15) textAnchor = "end";

                  return (
                    <text
                      key={i}
                      x={labelCoord.x}
                      y={labelCoord.y + 4}
                      textAnchor={textAnchor}
                      fill="#334155"
                      fontSize="10.5"
                      fontWeight="700"
                      className="select-none"
                    >
                      {d.categoria}
                    </text>
                  );
                })}
              </svg>

              {/* Hover Tooltip Overlay */}
              {hoveredIndex !== null && (
                <div className="absolute bottom-2 left-1/2 -translate-x-1/2 bg-slate-900/95 backdrop-blur-xs text-white px-3 py-2 rounded-xl shadow-xl text-xs border border-slate-700 pointer-events-none z-20">
                  <span className="font-bold text-emerald-400 mr-2">{dadosCategorias[hoveredIndex].categoria}:</span>
                  <span className="font-mono font-extrabold text-white">{dadosCategorias[hoveredIndex].media.toFixed(1)} / 5.0 ★</span>
                </div>
              )}
            </div>
          ) : (
            // Bar Chart
            <div className="w-full space-y-4 py-3">
              {dadosCategorias.map((d, i) => {
                const percent = Math.min(100, Math.round((d.media / 5) * 100));
                return (
                  <div key={i} className="space-y-1.5">
                    <div className="flex items-center justify-between text-xs">
                      <div className="flex items-center gap-2">
                        <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: d.cor }} />
                        <span className="font-bold text-slate-800">{d.categoria}</span>
                      </div>
                      <span className="font-mono font-extrabold text-slate-900 flex items-center gap-1">
                        <Icons.Star className="w-3.5 h-3.5 fill-amber-400 text-amber-400" />
                        {d.media.toFixed(1)} / 5.0
                      </span>
                    </div>
                    <div className="w-full bg-slate-200/80 h-3 rounded-full overflow-hidden p-0.5">
                      <div
                        className="h-full rounded-full transition-all duration-500"
                        style={{ width: `${percent}%`, backgroundColor: d.cor }}
                      />
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      // Global App States
      const [role, setRole] = useState('professor'); // 'diretor' | 'professor'
      const [professorNome, setProfessorNome] = useState('Prof. Carlos Eduardo (Matemática)');

      // Entities
      const [salas, setSalas] = useState([]);
      const [turmas, setTurmas] = useState([]);
      const [perguntas, setPerguntas] = useState([]);
      const [respostas, setRespostas] = useState([]);

      // Session Selection for Teacher
      const [selectedSalaId, setSelectedSalaId] = useState('');
      const [selectedTurmaId, setSelectedTurmaId] = useState('');
      const [showChangeModal, setShowChangeModal] = useState(false);

      // Teacher Tab & Questionnaire Form States
      const [teacherTab, setTeacherTab] = useState('responder'); // 'responder' | 'desempenho' | 'panorama'
      const [respostasState, setRespostasState] = useState({});
      const [observacoesAdicionais, setObservacoesAdicionais] = useState('');
      const [autoSaveStatus, setAutoSaveStatus] = useState('idle'); // 'idle' | 'saving' | 'saved'
      const [lastSavedTime, setLastSavedTime] = useState(null);
      const [hasRestoredDraft, setHasRestoredDraft] = useState(false);
      const [showSuccessCard, setShowSuccessCard] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const isInitialMount = useRef(true);

      // Chart Mode for Teacher Desempenho
      const [tipoGrafico, setTipoGrafico] = useState('radar'); // 'radar' | 'barras'
      const [selectedTurmaDesempenho, setSelectedTurmaDesempenho] = useState('');

      // Director View States
      const [directorTab, setDirectorTab] = useState('dashboard'); // 'dashboard' | 'salas' | 'turmas' | 'perguntas' | 'respostas'
      const [filtroTurmaDirector, setFiltroTurmaDirector] = useState('todos');
      const [filtroBuscaDirector, setFiltroBuscaDirector] = useState('');
      const [expandedRespostaId, setExpandedRespostaId] = useState(null);

      // Modal forms for Director CRUD
      const [novaSalaNome, setNovaSalaNome] = useState('');
      const [novaSalaBloco, setNovaSalaBloco] = useState('');
      const [novaSalaCapacidade, setNovaSalaCapacidade] = useState(35);

      const [novaTurmaNome, setNovaTurmaNome] = useState('');
      const [novaTurmaTurno, setNovaTurmaTurno] = useState('Manhã');

      const [novaPerguntaEnunciado, setNovaPerguntaEnunciado] = useState('');
      const [novaPerguntaCategoria, setNovaPerguntaCategoria] = useState('turma');
      const [novaPerguntaTipo, setNovaPerguntaTipo] = useState('escala');
      const [novaPerguntaObrigatoria, setNovaPerguntaObrigatoria] = useState(true);

      // Boot Data on Load
      useEffect(() => {
        const s = StorageService.getSalas();
        const t = StorageService.getTurmas();
        const p = StorageService.getPerguntas();
        const r = StorageService.getRespostas();

        setSalas(s);
        setTurmas(t);
        setPerguntas(p);
        setRespostas(r);

        if (s.length > 0) setSelectedSalaId(s[0].id);
        if (t.length > 0) {
          setSelectedTurmaId(t[0].id);
          setSelectedTurmaDesempenho(t[0].id);
        }
      }, []);

      // Selected Objects Helpers
      const activeSala = salas.find((s) => s.id === selectedSalaId) || salas[0] || { nome: 'Sala Geral' };
      const activeTurma = turmas.find((t) => t.id === selectedTurmaId) || turmas[0] || { nome: 'Turma Geral' };
      const activePerguntas = perguntas.filter((p) => p.ativa);

      // Unique Draft Keys per teacher and class
      const draftKey = `escola_draft_obs_${professorNome}_${selectedTurmaId || 'geral'}`;
      const draftRespostasKey = `escola_draft_respostas_${professorNome}_${selectedTurmaId || 'geral'}`;

      // ==============================================================
      // RESTORE PROGRESS ON SESSION INTERRUPTION (DEBOUNCED AUTO-SAVE)
      // ==============================================================
      useEffect(() => {
        isInitialMount.current = true;
        try {
          const savedObs = localStorage.getItem(draftKey);
          const savedResp = localStorage.getItem(draftRespostasKey);
          let found = false;

          if (savedObs) {
            setObservacoesAdicionais(savedObs);
            found = true;
          }

          if (savedResp) {
            const parsed = JSON.parse(savedResp);
            if (parsed && typeof parsed === 'object') {
              setRespostasState(parsed);
              found = true;
            }
          }

          if (found) {
            setHasRestoredDraft(true);
            setAutoSaveStatus('saved');
            const now = new Date();
            setLastSavedTime(now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
          } else {
            setHasRestoredDraft(false);
            setAutoSaveStatus('idle');
          }
        } catch (e) {
          console.warn('Erro ao carregar rascunho:', e);
        }
      }, [draftKey, draftRespostasKey]);

      // Debounced Auto-Save (600ms)
      useEffect(() => {
        if (isInitialMount.current) {
          isInitialMount.current = false;
          return;
        }

        setAutoSaveStatus('saving');
        const timer = setTimeout(() => {
          try {
            if (observacoesAdicionais.trim()) {
              localStorage.setItem(draftKey, observacoesAdicionais);
            } else {
              localStorage.removeItem(draftKey);
            }

            if (Object.keys(respostasState).length > 0) {
              localStorage.setItem(draftRespostasKey, JSON.stringify(respostasState));
            }

            const now = new Date();
            setLastSavedTime(now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
            setAutoSaveStatus('saved');
          } catch (err) {
            setAutoSaveStatus('idle');
          }
        }, 600);

        return () => clearTimeout(timer);
      }, [observacoesAdicionais, respostasState, draftKey, draftRespostasKey]);

      const handleClearDraft = () => {
        try {
          localStorage.removeItem(draftKey);
          localStorage.removeItem(draftRespostasKey);
        } catch {}
        setObservacoesAdicionais('');
        setRespostasState({});
        setHasRestoredDraft(false);
        setAutoSaveStatus('idle');
        setLastSavedTime(null);
      };

      const handleSetValor = (perguntaId, valor) => {
        setRespostasState((prev) => ({ ...prev, [perguntaId]: valor }));
      };

      const isObsQuestion = (p) =>
        p.id === 'p-7' || p.enunciado.toLowerCase().includes('observações adicionais');

      // Submit Evaluation Form
      const handleSubmit = (e) => {
        e.preventDefault();

        // Validate mandatory
        for (const p of activePerguntas) {
          if (p.obrigatoria) {
            const val = isObsQuestion(p) ? (observacoesAdicionais || respostasState[p.id]) : respostasState[p.id];
            if (val === undefined || val === '') {
              alert(`Por favor, responda a pergunta obrigatória:\n"${p.enunciado}"`);
              return;
            }
          }
        }

        setIsSubmitting(true);
        setTimeout(() => {
          const finalRespostas = { ...respostasState };
          const obsQ = activePerguntas.find((p) => isObsQuestion(p));
          if (obsQ && observacoesAdicionais) {
            finalRespostas[obsQ.id] = observacoesAdicionais;
          }

          const now = Date.now();
          const novaResposta = {
            id: 'resp-' + now,
            professorNome: professorNome,
            salaId: activeSala.id,
            salaNome: activeSala.nome,
            turmaId: activeTurma.id,
            turmaNome: activeTurma.nome,
            respostas: finalRespostas,
            observacoesGerais: observacoesAdicionais.trim() || undefined,
            criadaEm: new Date(now).toISOString(),
            timestamp: now,
          };

          const updated = [novaResposta, ...respostas];
          setRespostas(updated);
          StorageService.setRespostas(updated);

          // Clear draft
          handleClearDraft();
          setSelectedTurmaDesempenho(activeTurma.id);
          setIsSubmitting(false);
          setShowSuccessCard(true);
        }, 400);
      };

      // Download this single HTML file directly to user machine
      const handleDownloadStandaloneHTML = () => {
        const htmlContent = document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'gestao-escolar-questionario.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      // Export Responses as CSV
      const handleExportCSV = () => {
        let csv = 'ID;Professor;Turma;Sala;Data;Observacoes Gerais\n';
        respostas.forEach((r) => {
          const dataFormatada = new Date(r.timestamp).toLocaleDateString('pt-BR');
          const obs = (r.observacoesGerais || '').replace(/[\n\r;]/g, ' ');
          csv += `"${r.id}";"${r.professorNome}";"${r.turmaNome}";"${r.salaNome}";"${dataFormatada}";"${obs}"\n`;
        });
        const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'relatorio_respostas_escola.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

      // Helper for Caixa Avaliação
      const caixasOpcoes = [
        { tipo: 'Ótimo', nota: 5, label: 'Ótimo', sublabel: 'Excelente / Acima do esperado', icon: Icons.ThumbsUp, bg: 'bg-emerald-50/50', border: 'border-emerald-200', text: 'text-emerald-800', activeBg: 'bg-emerald-600 text-white shadow-xs' },
        { tipo: 'Bom', nota: 4, label: 'Bom', sublabel: 'Adequado / Dentro do padrão', icon: Icons.Smile, bg: 'bg-sky-50/50', border: 'border-sky-200', text: 'text-sky-800', activeBg: 'bg-sky-600 text-white shadow-xs' },
        { tipo: 'Regular', nota: 3, label: 'Regular', sublabel: 'Abaixo do ideal / Atenção', icon: Icons.Meh, bg: 'bg-amber-50/50', border: 'border-amber-200', text: 'text-amber-800', activeBg: 'bg-amber-600 text-white shadow-xs' },
        { tipo: 'Ruim', nota: 1, label: 'Ruim', sublabel: 'Crítico / Requer intervenção', icon: Icons.Frown, bg: 'bg-rose-50/50', border: 'border-rose-200', text: 'text-rose-800', activeBg: 'bg-rose-600 text-white shadow-xs' },
      ];

      // Categories computation for Recharts / SVG Radar & Bar Chart
      const calcularMediasCategorias = (turmaId) => {
        const respostasDaTurma = respostas.filter((r) => r.turmaId === turmaId);
        const categoriasBase = {
          turma: { nome: 'Comportamento da Turma', descricao: 'Foco, pontualidade, disciplina e participação em sala', cor: '#10b981', notas: [] },
          sala: { nome: 'Estrutura & Recursos', descricao: 'Equipamentos, materiais didáticos e ambiente físico', cor: '#0ea5e9', notas: [] },
          geral: { nome: 'Geral & Pedagógico', descricao: 'Clima escolar, desenvolvimento das aulas e melhorias', cor: '#6366f1', notas: [] },
        };

        respostasDaTurma.forEach((resp) => {
          Object.entries(resp.respostas).forEach(([pid, val]) => {
            const pergunta = perguntas.find((p) => p.id === pid);
            if (!pergunta) return;
            const cat = pergunta.categoria;
            if (!categoriasBase[cat]) return;

            let notaNum = null;
            if (typeof val === 'number') notaNum = val;
            else if (typeof val === 'string') {
              if (val === 'Ótimo') notaNum = 5;
              else if (val === 'Bom') notaNum = 4;
              else if (val === 'Regular') notaNum = 3;
              else if (val === 'Ruim') notaNum = 1;
              else if (val === 'Sim') {
                const isNeg = pergunta.enunciado.toLowerCase().includes('ocorrência') || pergunta.enunciado.toLowerCase().includes('grave');
                notaNum = isNeg ? 1.5 : 5;
              } else if (val === 'Não') {
                const isNeg = pergunta.enunciado.toLowerCase().includes('ocorrência') || pergunta.enunciado.toLowerCase().includes('grave');
                notaNum = isNeg ? 5 : 2;
              } else if (pergunta.opcoes && pergunta.opcoes.length > 0) {
                const idx = pergunta.opcoes.indexOf(val);
                if (idx !== -1) notaNum = Number((5 - idx * (3 / Math.max(1, pergunta.opcoes.length - 1))).toFixed(1));
              }
            }

            if (notaNum !== null && !isNaN(notaNum)) {
              categoriasBase[cat].notas.push(notaNum);
            }
          });
        });

        return Object.entries(categoriasBase).map(([catKey, data]) => {
          const media = data.notas.length > 0 ? Number((data.notas.reduce((a, b) => a + b, 0) / data.notas.length).toFixed(1)) : 0;
          return {
            key: catKey,
            categoria: data.nome,
            descricao: data.descricao,
            media,
            totalRespostas: data.notas.length,
            cor: data.cor,
          };
        });
      };

      // Overall Metrics for selected class
      const getTurmaMetrics = (turmaId) => {
        const respostasDaTurma = respostas.filter((r) => r.turmaId === turmaId);
        if (respostasDaTurma.length === 0) {
          return { totalAvaliacoes: 0, mediaNota: 0, status: 'Sem avaliações', corStatus: 'text-slate-500 bg-slate-100', ocorrenciasCount: 0 };
        }
        let totalNotas = [];
        let ocorrencias = 0;
        respostasDaTurma.forEach((r) => {
          Object.entries(r.respostas).forEach(([pid, val]) => {
            if (val === 'Ótimo') totalNotas.push(5);
            else if (val === 'Bom') totalNotas.push(4);
            else if (val === 'Regular') totalNotas.push(3);
            else if (val === 'Ruim') totalNotas.push(1);
            if (pid === 'p-6' && val === 'Sim') ocorrencias++;
          });
        });
        const media = totalNotas.length > 0 ? Number((totalNotas.reduce((a, b) => a + b, 0) / totalNotas.length).toFixed(1)) : 4.0;
        let status = 'Ótimo';
        let corStatus = 'text-emerald-700 bg-emerald-50 border-emerald-200';
        if (media < 2.5) { status = 'Atenção Crítica'; corStatus = 'text-rose-700 bg-rose-50 border-rose-200'; }
        else if (media < 3.5) { status = 'Regular'; corStatus = 'text-amber-700 bg-amber-50 border-amber-200'; }
        else if (media < 4.4) { status = 'Bom'; corStatus = 'text-sky-700 bg-sky-50 border-sky-200'; }
        return { totalAvaliacoes: respostasDaTurma.length, mediaNota: media, status, corStatus, ocorrenciasCount: ocorrencias };
      };

      const respondidasCount = activePerguntas.filter((p) => {
        const val = isObsQuestion(p) ? (observacoesAdicionais || respostasState[p.id]) : respostasState[p.id];
        return val !== undefined && val !== '';
      }).length;
      const progressPercent = activePerguntas.length > 0 ? Math.round((respondidasCount / activePerguntas.length) * 100) : 0;

      // Filtered responses for director view
      const filteredRespostasDirector = respostas.filter((r) => {
        const matchTurma = filtroTurmaDirector === 'todos' || r.turmaId === filtroTurmaDirector;
        const matchBusca = !filtroBuscaDirector ||
          r.professorNome.toLowerCase().includes(filtroBuscaDirector.toLowerCase()) ||
          r.turmaNome.toLowerCase().includes(filtroBuscaDirector.toLowerCase());
        return matchTurma && matchBusca;
      });

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          {/* ============================================================== */}
          {/* TOP APP HEADER & NAVIGATION BAR                                */}
          {/* ============================================================== */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-indigo-600 text-white flex items-center justify-center shadow-xs">
                  <Icons.GraduationCap className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="font-extrabold text-slate-900 text-sm sm:text-base leading-tight">
                    Gestão Escolar
                  </h1>
                  <p className="text-[11px] text-slate-500 font-medium hidden sm:block">
                    Questionário de Salas & Turmas (Arquivo Único Autônomo)
                  </p>
                </div>
              </div>

              {/* Right Action Bar */}
              <div className="flex items-center gap-2.5">
                {/* Download Standalone Button */}
                <button
                  onClick={handleDownloadStandaloneHTML}
                  title="Baixar este arquivo HTML para rodar 100% offline em qualquer computador"
                  className="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 border border-slate-300 transition-colors flex items-center gap-1.5 cursor-pointer shadow-2xs"
                >
                  <Icons.Download className="w-3.5 h-3.5 text-emerald-600" />
                  <span className="hidden md:inline">Baixar index.html</span>
                </button>

                {/* Profile Switcher (Diretor / Professor) */}
                <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                  <button
                    onClick={() => setRole('professor')}
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                      role === 'professor'
                        ? 'bg-emerald-600 text-white shadow-xs'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <Icons.Users className="w-3.5 h-3.5" />
                    <span>Professor</span>
                  </button>
                  <button
                    onClick={() => setRole('diretor')}
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                      role === 'diretor'
                        ? 'bg-indigo-600 text-white shadow-xs'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <Icons.Award className="w-3.5 h-3.5" />
                    <span>Diretor</span>
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* ============================================================== */}
          {/* ROLE: PROFESSOR PORTAL                                         */}
          {/* ============================================================== */}
          {role === 'professor' && (
            <main className="max-w-5xl mx-auto px-4 sm:px-6 py-6 w-full flex-1">
              {/* Teacher Header Banner */}
              <div className="bg-gradient-to-r from-emerald-700 via-teal-800 to-indigo-900 rounded-2xl p-6 text-white shadow-xs mb-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-500/30 border border-emerald-400/40 text-[11px] font-semibold text-emerald-100 mb-2">
                      <Icons.CheckCircle2 className="w-3.5 h-3.5" />
                      Portal do Docente Ativo &bull; Local Storage
                    </div>
                    <h2 className="text-xl sm:text-2xl font-extrabold tracking-tight">
                      {professorNome}
                    </h2>
                    <div className="flex flex-wrap items-center gap-3 mt-2 text-xs sm:text-sm text-emerald-100 font-medium">
                      <span className="flex items-center gap-1.5 bg-black/20 px-3 py-1.5 rounded-lg border border-white/10">
                        <Icons.Users className="w-4 h-4 text-emerald-300" />
                        Turma: <strong className="text-white ml-1">{activeTurma.nome}</strong>
                      </span>
                      <span className="flex items-center gap-1.5 bg-black/20 px-3 py-1.5 rounded-lg border border-white/10">
                        <Icons.Building className="w-4 h-4 text-emerald-300" />
                        Sala: <strong className="text-white ml-1">{activeSala.nome}</strong>
                      </span>
                    </div>
                  </div>

                  <button
                    onClick={() => setShowChangeModal(true)}
                    className="px-4 py-2 bg-white/15 hover:bg-white/25 border border-white/25 rounded-xl text-xs font-semibold text-white transition-colors cursor-pointer shrink-0 shadow-xs flex items-center gap-1.5"
                  >
                    <Icons.Users className="w-3.5 h-3.5" />
                    <span>Mudar de Turma / Sala</span>
                  </button>
                </div>
              </div>

              {/* Teacher Tabs */}
              <div className="flex items-center gap-2 border-b border-slate-200 mb-6 overflow-x-auto">
                <button
                  onClick={() => { setTeacherTab('responder'); setShowSuccessCard(false); }}
                  className={`flex items-center gap-2 px-4 py-2.5 text-xs sm:text-sm font-bold border-b-2 transition-colors whitespace-nowrap cursor-pointer ${
                    teacherTab === 'responder'
                      ? 'border-emerald-600 text-emerald-700'
                      : 'border-transparent text-slate-500 hover:text-slate-800'
                  }`}
                >
                  <Icons.ClipboardList className="w-4 h-4" />
                  <span>Responder Questionário</span>
                </button>
                <button
                  onClick={() => setTeacherTab('desempenho')}
                  className={`flex items-center gap-2 px-4 py-2.5 text-xs sm:text-sm font-bold border-b-2 transition-colors whitespace-nowrap cursor-pointer ${
                    teacherTab === 'desempenho'

                              {m.status}
                            </span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </main>
          )}

          {/* ============================================================== */}
          {/* ROLE: DIRETOR DASHBOARD & GESTÃO COMPLETA                      */}
          {/* ============================================================== */}
          {role === 'diretor' && (
            <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6 w-full flex-1 space-y-6">
              {/* Director Header */}
              <div className="bg-gradient-to-r from-indigo-900 via-slate-900 to-indigo-950 rounded-2xl p-6 text-white shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-indigo-500/30 border border-indigo-400/30 text-[11px] font-semibold text-indigo-200 mb-2">
                    <Icons.Award className="w-3.5 h-3.5" />
                    Painel da Direção Escolar
                  </div>
                  <h2 className="text-xl sm:text-2xl font-extrabold tracking-tight">
                    Coordenação & Gestão Pedagógica
                  </h2>
                  <p className="text-xs sm:text-sm text-indigo-200 mt-1">
                    Cadastre salas, turmas e perguntas do questionário, e acompanhe todos os envios.
                  </p>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={handleExportCSV}
                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-xs transition-colors flex items-center gap-1.5 cursor-pointer"
                  >
                    <Icons.FileSpreadsheet className="w-3.5 h-3.5" />
                    <span>Exportar CSV</span>
                  </button>
                  <button
                    onClick={() => {
                      if (confirm('Restaurar dados de exemplo do sistema?')) {
                        StorageService.resetAll();
                        setSalas(StorageService.getSalas());
                        setTurmas(StorageService.getTurmas());
                        setPerguntas(StorageService.getPerguntas());
                        setRespostas(StorageService.getRespostas());
                      }
                    }}
                    className="px-3 py-2 bg-white/10 hover:bg-white/20 text-white font-bold text-xs rounded-xl transition-colors flex items-center gap-1.5 cursor-pointer"
                  >
                    <Icons.RotateCcw className="w-3.5 h-3.5" />
                    <span>Resetar</span>
                  </button>
                </div>
              </div>

              {/* Director Tabs */}
              <div className="flex items-center gap-2 border-b border-slate-200 overflow-x-auto">
                {[
                  { id: 'dashboard', label: 'Dashboard & Métricas', icon: Icons.BarChart3 },
                  { id: 'perguntas', label: `Perguntas (${perguntas.length})`, icon: Icons.ClipboardList },
                  { id: 'turmas', label: `Turmas (${turmas.length})`, icon: Icons.Users },
                  { id: 'salas', label: `Salas (${salas.length})`, icon: Icons.Building },
                  { id: 'respostas', label: `Envios Recebidos (${respostas.length})`, icon: Icons.MessageSquare },
                ].map((t) => {
                  const IconComp = t.icon;
                  return (
                    <button
                      key={t.id}
                      onClick={() => setDirectorTab(t.id)}
                      className={`flex items-center gap-2 px-4 py-2.5 text-xs sm:text-sm font-bold border-b-2 transition-colors whitespace-nowrap cursor-pointer ${
                        directorTab === t.id
                          ? 'border-indigo-600 text-indigo-700'
                          : 'border-transparent text-slate-500 hover:text-slate-800'
                      }`}
                    >
                      <IconComp className="w-4 h-4" />
                      <span>{t.label}</span>
                    </button>
                  );
                })}
              </div>

              {/* TAB: DASHBOARD */}
              {directorTab === 'dashboard' && (
                <div className="space-y-6">
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Salas Físicas</span>
                      <div className="text-2xl font-extrabold text-slate-900 mt-1 font-mono">{salas.length}</div>
                      <p className="text-xs text-slate-500 mt-1">Cadastradas no sistema</p>
                    </div>
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Turmas</span>
                      <div className="text-2xl font-extrabold text-slate-900 mt-1 font-mono">{turmas.length}</div>
                      <p className="text-xs text-slate-500 mt-1">Em atividade</p>
                    </div>
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Perguntas Ativas</span>
                      <div className="text-2xl font-extrabold text-emerald-700 mt-1 font-mono">{activePerguntas.length}</div>
                      <p className="text-xs text-slate-500 mt-1">No questionário do professor</p>
                    </div>
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Envios Computados</span>
                      <div className="text-2xl font-extrabold text-indigo-700 mt-1 font-mono">{respostas.length}</div>
                      <p className="text-xs text-slate-500 mt-1">Respostas gravadas</p>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB: PERGUNTAS */}
              {directorTab === 'perguntas' && (
                <div className="space-y-6">
                  {/* Form Adicionar Pergunta */}
                  <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-xs">
                    <h3 className="text-sm font-bold text-slate-900 mb-3 flex items-center gap-2">
                      <Icons.Plus className="w-4 h-4 text-indigo-600" />
                      <span>Cadastrar Nova Pergunta no Questionário</span>
                    </h3>
                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        if (!novaPerguntaEnunciado.trim()) return;
                        const nova = {
                          id: 'p-' + Date.now(),
                          enunciado: novaPerguntaEnunciado.trim(),
                          categoria: novaPerguntaCategoria,
                          tipo: novaPerguntaTipo,
                          obrigatoria: novaPerguntaObrigatoria,
                          ativa: true,
                          ordem: perguntas.length + 1,
                        };
                        const updated = [...perguntas, nova];
                        setPerguntas(updated);
                        StorageService.setPerguntas(updated);
                        setNovaPerguntaEnunciado('');
                      }}
                      className="space-y-3"
                    >
                      <div>
                        <input
                          type="text"
                          required
                          value={novaPerguntaEnunciado}
                          onChange={(e) => setNovaPerguntaEnunciado(e.target.value)}
                          placeholder="Digite o enunciado da pergunta (ex: Como está a ventilação e iluminação da sala?)"
                          className="w-full text-xs sm:text-sm px-3.5 py-2.5 border border-slate-300 rounded-lg"
                        />
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <select
                          value={novaPerguntaCategoria}
                          onChange={(e) => setNovaPerguntaCategoria(e.target.value)}
                          className="text-xs px-3 py-2 border border-slate-300 rounded-lg bg-white"
                        >
                          <option value="turma">Categoria: Turma / Alunos</option>
                          <option value="sala">Categoria: Sala / Infraestrutura</option>
                          <option value="geral">Categoria: Geral / Coordenação</option>
                        </select>
                        <select
                          value={novaPerguntaTipo}
                          onChange={(e) => setNovaPerguntaTipo(e.target.value)}
                          className="text-xs px-3 py-2 border border-slate-300 rounded-lg bg-white"
                        >
                          <option value="escala">Tipo: Escala (Caixas Ótimo a Ruim)</option>
                          <option value="sim_nao">Tipo: Sim / Não</option>
                          <option value="texto">Tipo: Texto Livre</option>
                        </select>
                        <button
                          type="submit"
                          className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold transition-colors cursor-pointer"
                        >
                          + Adicionar Pergunta
                        </button>
                      </div>
                    </form>
                  </div>

                  {/* Lista de Perguntas */}
                  <div className="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden shadow-xs">
                    {perguntas.map((p, i) => (
                      <div key={p.id} className="p-4 flex items-center justify-between gap-4">
                        <div className="flex items-start gap-3">
                          <span className="font-mono text-xs font-bold text-slate-400 mt-0.5">#{i + 1}</span>
                          <div>
                            <p className="text-xs sm:text-sm font-bold text-slate-900">{p.enunciado}</p>
                            <div className="flex items-center gap-2 mt-1">
                              <span className="text-[10px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded uppercase">
                                {p.categoria}
                              </span>
                              <span className="text-[10px] font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded">
                                {p.tipo}
                              </span>
                              {p.obrigatoria && (
                                <span className="text-[10px] font-bold text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded">
                                  Obrigatória
                                </span>
                              )}
                            </div>
                          </div>
                        </div>

                        <button
                          onClick={() => {
                            if (confirm('Deseja excluir esta pergunta?')) {
                              const updated = perguntas.filter((item) => item.id !== p.id);
                              setPerguntas(updated);
                              StorageService.setPerguntas(updated);
                            }
                          }}
                          className="p-1.5 text-slate-400 hover:text-rose-600 transition-colors cursor-pointer"
                        >
                          <Icons.Trash2 className="w-4 h-4" />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB: TURMAS */}
              {directorTab === 'turmas' && (
                <div className="space-y-6">
                  {/* Form Adicionar Turma */}
                  <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-xs">
                    <h3 className="text-sm font-bold text-slate-900 mb-3 flex items-center gap-2">
                      <Icons.Plus className="w-4 h-4 text-indigo-600" />
                      <span>Cadastrar Nova Turma</span>
                    </h3>
                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        if (!novaTurmaNome.trim()) return;
                        const nova = {
                          id: 'turma-' + Date.now(),
                          nome: novaTurmaNome.trim(),
                          turno: novaTurmaTurno,
                        };
                        const updated = [...turmas, nova];
                        setTurmas(updated);
                        StorageService.setTurmas(updated);
                        setNovaTurmaNome('');
                      }}
                      className="flex flex-col sm:flex-row gap-3"
                    >
                      <input
                        type="text"
                        required
                        value={novaTurmaNome}
                        onChange={(e) => setNovaTurmaNome(e.target.value)}
                        placeholder="Nome da Turma (ex: 2º Ano C)"
                        className="flex-1 text-xs sm:text-sm px-3.5 py-2.5 border border-slate-300 rounded-lg"
                      />
                      <select
                        value={novaTurmaTurno}
                        onChange={(e) => setNovaTurmaTurno(e.target.value)}
                        className="text-xs px-3 py-2 border border-slate-300 rounded-lg bg-white"
                      >
                        <option value="Manhã">Turno: Manhã</option>
                        <option value="Tarde">Turno: Tarde</option>
                        <option value="Noite">Turno: Noite</option>
                        <option value="Integral">Turno: Integral</option>
                      </select>
                      <button
                        type="submit"
                        className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold transition-colors cursor-pointer"
                      >
                        + Adicionar
                      </button>
                    </form>
                  </div>

                  {/* Grid de Turmas */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {turmas.map((t) => (
                      <div key={t.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between">
                        <div>
                          <p className="font-bold text-sm text-slate-900">{t.nome}</p>
                          <p className="text-xs text-slate-500">Turno: {t.turno}</p>
                        </div>
                        <button
                          onClick={() => {
                            if (confirm(`Excluir turma "${t.nome}"?`)) {
                              const updated = turmas.filter((item) => item.id !== t.id);
                              setTurmas(updated);
                              StorageService.setTurmas(updated);
                            }
                          }}
                          className="p-1.5 text-slate-400 hover:text-rose-600 cursor-pointer"
                        >
                          <Icons.Trash2 className="w-4 h-4" />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB: SALAS */}
              {directorTab === 'salas' && (
                <div className="space-y-6">
                  <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-xs">
                    <h3 className="text-sm font-bold text-slate-900 mb-3 flex items-center gap-2">
                      <Icons.Plus className="w-4 h-4 text-indigo-600" />
                      <span>Cadastrar Nova Sala de Aula</span>
                    </h3>
                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        if (!novaSalaNome.trim()) return;
                        const nova = {
                          id: 'sala-' + Date.now(),
                          nome: novaSalaNome.trim(),
                          bloco: novaSalaBloco.trim() || 'Bloco Geral',
                          capacidade: Number(novaSalaCapacidade) || 35,
                        };
                        const updated = [...salas, nova];
                        setSalas(updated);
                        StorageService.setSalas(updated);
                        setNovaSalaNome('');
                        setNovaSalaBloco('');
                      }}
                      className="grid grid-cols-1 sm:grid-cols-4 gap-3"
                    >
                      <input
                        type="text"
                        required
                        value={novaSalaNome}
                        onChange={(e) => setNovaSalaNome(e.target.value)}
                        placeholder="Nome (ex: Sala 301)"
                        className="text-xs sm:text-sm px-3.5 py-2.5 border border-slate-300 rounded-lg sm:col-span-2"
                      />
                      <input
                        type="text"
                        value={novaSalaBloco}
                        onChange={(e) => setNovaSalaBloco(e.target.value)}
                        placeholder="Bloco / Andar"
                        className="text-xs sm:text-sm px-3.5 py-2.5 border border-slate-300 rounded-lg"
                      />
                      <button
                        type="submit"
                        className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold transition-colors cursor-pointer"
                      >
                        + Adicionar
                      </button>
                    </form>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {salas.map((s) => (
                      <div key={s.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between">
                        <div>
                          <p className="font-bold text-sm text-slate-900">{s.nome}</p>
                          <p className="text-xs text-slate-500">{s.bloco} &bull; {s.capacidade} alunos</p>
                        </div>
                        <button
                          onClick={() => {
                            if (confirm(`Excluir sala "${s.nome}"?`)) {
                              const updated = salas.filter((item) => item.id !== s.id);
                              setSalas(updated);
                              StorageService.setSalas(updated);
                            }
                          }}
                          className="p-1.5 text-slate-400 hover:text-rose-600 cursor-pointer"
                        >
                          <Icons.Trash2 className="w-4 h-4" />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB: RESPOSTAS RECEBIDAS */}
              {directorTab === 'respostas' && (
                <div className="space-y-4">
                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div className="w-full sm:w-64">
                      <select
                        value={filtroTurmaDirector}
                        onChange={(e) => setFiltroTurmaDirector(e.target.value)}
                        className="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg bg-white"
                      >
                        <option value="todos">Todas as Turmas ({turmas.length})</option>
                        {turmas.map((t) => (
                          <option key={t.id} value={t.id}>{t.nome}</option>
                        ))}
                      </select>
                    </div>

                    <div className="w-full sm:w-72">
                      <input
                        type="text"
                        value={filtroBuscaDirector}
                        onChange={(e) => setFiltroBuscaDirector(e.target.value)}
                        placeholder="Buscar por professor ou turma..."
                        className="w-full text-xs px-3.5 py-2 border border-slate-300 rounded-lg"
                      />
                    </div>
                  </div>

                  <div className="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden shadow-xs">
                    {filteredRespostasDirector.length === 0 ? (
                      <div className="p-12 text-center text-slate-400">
                        Nenhuma resposta encontrada para os filtros atuais.
                      </div>
                    ) : (
                      filteredRespostasDirector.map((r) => {
                        const isExpanded = expandedRespostaId === r.id;
                        const dataStr = new Date(r.timestamp).toLocaleString('pt-BR');

                        return (
                          <div key={r.id} className="p-4 hover:bg-slate-50/60 transition-colors">
                            <div
                              onClick={() => setExpandedRespostaId(isExpanded ? null : r.id)}
                              className="flex items-start justify-between gap-4 cursor-pointer"
                            >
                              <div>
                                <div className="flex items-center gap-2 flex-wrap mb-1">
                                  <span className="font-bold text-sm text-slate-900">{r.professorNome}</span>
                                  <span className="text-slate-300">&bull;</span>
                                  <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-200">
                                    Turma: {r.turmaNome}
                                  </span>
                                  <span className="text-xs text-slate-600">Sala: {r.salaNome}</span>
                                </div>
                                <div className="text-xs text-slate-400 flex items-center gap-2">
                                  <Icons.Calendar className="w-3.5 h-3.5" />
                                  <span>{dataStr}</span>
                                </div>
                              </div>

                              <div className="flex items-center gap-1.5 text-xs text-indigo-600 font-semibold">
                                <span>{isExpanded ? 'Recolher' : 'Ver Detalhes'}</span>
                                {isExpanded ? <Icons.ChevronUp className="w-4 h-4" /> : <Icons.ChevronDown className="w-4 h-4" />}
                              </div>
                            </div>

                            {/* Detalhes Expandidos */}
                            {isExpanded && (
                              <div className="mt-4 pt-4 border-t border-slate-100 space-y-2.5 animate-fade-in">
                                {Object.entries(r.respostas).map(([pid, val]) => {
                                  const pObj = perguntas.find((p) => p.id === pid);
                                  return (
                                    <div key={pid} className="bg-slate-50 p-2.5 rounded-lg border border-slate-200/80 text-xs">
                                      <p className="font-semibold text-slate-600 mb-0.5">{pObj ? pObj.enunciado : pid}</p>
                                      <p className="font-bold text-slate-900">{String(val)}</p>
                                    </div>
                                  );
                                })}

                                {r.observacoesGerais && (
                                  <div className="bg-indigo-50/70 p-3 rounded-lg border border-indigo-200 text-xs mt-2">
                                    <div className="font-bold text-indigo-900 mb-1 flex items-center gap-1.5">
                                      <Icons.MessageSquare className="w-3.5 h-3.5 text-indigo-700" />
                                      Observações Adicionais Registradas:
                                    </div>
                                    <p className="text-slate-800 whitespace-pre-wrap leading-relaxed">{r.observacoesGerais}</p>
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              )}
            </main>
          )}

          {/* ============================================================== */}
          {/* MODAL: MUDAR DE TURMA / SALA                                   */}
          {/* ============================================================== */}
          {showChangeModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-fade-in">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h3 className="font-extrabold text-slate-900 text-base">Mudar de Turma ou Sala</h3>
                  <button onClick={() => setShowChangeModal(false)} className="text-slate-400 hover:text-slate-600 cursor-pointer">
                    <Icons.Check className="w-5 h-5 hidden" />
                    ✕
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Selecione a Turma:</label>
                    <select
                      value={selectedTurmaId}
                      onChange={(e) => setSelectedTurmaId(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-lg bg-white"
                    >
                      {turmas.map((t) => (
                        <option key={t.id} value={t.id}>{t.nome} ({t.turno})</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Selecione a Sala de Aula:</label>
                    <select
                      value={selectedSalaId}
                      onChange={(e) => setSelectedSalaId(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-lg bg-white"
                    >
                      {salas.map((s) => (
                        <option key={s.id} value={s.id}>{s.nome} - {s.bloco}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="pt-2 flex items-center justify-end gap-2">
                  <button
                    onClick={() => setShowChangeModal(false)}
                    className="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-lg cursor-pointer"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={() => {
                      setSelectedTurmaDesempenho(selectedTurmaId);
                      setShowChangeModal(false);
                    }}
                    className="px-5 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg cursor-pointer shadow-xs"
                  >
                    Confirmar Seleção
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-400">
            Gestão Escolar Autônoma &bull; Executando 100% no seu navegador &bull; Dados salvos no LocalStorage
          </footer>
        </div>
      );
    }

    // Mount to Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
